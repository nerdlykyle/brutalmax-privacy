<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrutalMaxer GL test</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #232323; color: #FAFAFA; font: 14px/1.4 ui-monospace, Menlo, monospace; }
  h1 { font: 700 18px/1.2 system-ui, sans-serif; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #A3A3A3; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .t { border: 2px solid #0D0D0D; background: #1A1A1A; padding: 8px; }
  .t b { display: block; font-size: 22px; color: #818CF8; }
  .t span { display: block; font-size: 11px; color: #D4D4D4; min-height: 2.6em; }
  .t canvas { display: block; width: 100%; aspect-ratio: 1; background: #333; }
  .t i { display: block; font-style: normal; font-size: 11px; color: #62F167; margin-top: 4px; }
</style>
</head>
<body>
<h1>3D display test</h1>
<p>Each box should show a spinning purple triangle on a gray square. Tell me the letters of the boxes where you see NO triangle.</p>
<div class="grid" id="grid"></div>
<script>
(function () {
  var TESTS = [
    ['A', 'Current site settings', { antialias: true, alpha: true, powerPreference: 'low-power' }, 2],
    ['B', 'No antialias', { antialias: false, alpha: true, powerPreference: 'low-power' }, 2],
    ['C', 'Default power', { antialias: true, alpha: true, powerPreference: 'default' }, 2],
    ['D', 'Preserve buffer', { antialias: true, alpha: true, powerPreference: 'low-power', preserveDrawingBuffer: true }, 2],
    ['E', 'No AA + preserve', { antialias: false, alpha: true, preserveDrawingBuffer: true }, 2],
    ['F', 'Opaque (no alpha)', { antialias: true, alpha: false, powerPreference: 'low-power' }, 2],
    ['G', 'WebGL 1', { antialias: true, alpha: true }, 1],
    ['H', 'No AA, no alpha', { antialias: false, alpha: false }, 2]
  ];
  var VS = 'attribute vec2 p; uniform float t; void main(){ float c=cos(t), s=sin(t); gl_Position=vec4(c*p.x-s*p.y, s*p.x+c*p.y, 0.0, 1.0); }';
  var FS = 'precision mediump float; void main(){ gl_FragColor=vec4(0.506,0.549,0.973,1.0); }';
  var grid = document.getElementById('grid');
  TESTS.forEach(function (t) {
    var box = document.createElement('div'); box.className = 't';
    box.innerHTML = '<b>' + t[0] + '</b><span>' + t[1] + '</span>';
    var cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
    var note = document.createElement('i');
    box.appendChild(cv); box.appendChild(note); grid.appendChild(box);
    var gl = cv.getContext(t[3] === 2 ? 'webgl2' : 'webgl', t[2]);
    if (!gl) { note.textContent = 'no context'; return; }
    function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    var pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { note.textContent = 'link failed'; return; }
    gl.useProgram(pr);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0.7, -0.6, -0.45, 0.6, -0.45]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var ut = gl.getUniformLocation(pr, 't');
    var first = true;
    function frame(now) {
      gl.viewport(0, 0, cv.width, cv.height);
      gl.clearColor(0.2, 0.2, 0.2, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(ut, now / 900);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (first) {
        first = false;
        var px = new Uint8Array(4); gl.readPixels(120, 120, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        note.textContent = 'buffer: ' + (px[2] > 200 ? 'drew' : 'blank ' + px.join(','));
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
